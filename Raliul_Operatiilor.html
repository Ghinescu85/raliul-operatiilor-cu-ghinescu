<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Raliul Operațiilor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Concept: afiș de raliu de epocă — plăcuțe bordo cu anul, drum asfaltat, mașini cu flancuri albe; totul mare și rotund, pentru degete mici. */
:root{
  --bg:#e8eaee; --paper:#fbf9f4; --ink:#1d1f27; --muted:#5b5f6e; --line:#d5d8df;
  --burgundy:#6b1f2b; --burgundy-2:#8c2c3b; --cream:#f1e4c9; --gold:#c69b4f; --gold-hi:#ecd296;
  --road:#3a3e49; --grass:#9db58a; --sky:#dfe7ee;
  --good:#2c8a57; --good-bg:#e1f3e8; --bad:#c2412f; --bad-bg:#fbe6e2; --info-bg:#fff4dc;
  --f-display:"Alfa Slab One","Rockwell","Georgia",serif;
  --f-body:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Bara de sus */
.topbar{background:var(--burgundy);color:var(--cream);border-bottom:4px solid var(--gold)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit}
.logo .wheel-ic{width:34px;height:34px}
.logo b{font-family:var(--f-display);font-size:21px;letter-spacing:.02em;font-weight:400}
.spacer{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid rgba(241,228,201,.45);background:transparent;color:var(--cream)}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn svg{width:22px;height:22px}

/* Butoane */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 22px;border-radius:16px;border:3px solid var(--ink);background:var(--paper);font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:22px;height:22px;flex:none}
.btn-go{background:var(--gold);}
.btn-red{background:var(--burgundy);color:var(--cream)}
.btn-sm{min-height:42px;padding:6px 14px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}

/* Plăcuța de an, ca în afișele de epocă */
.plate{display:inline-flex;align-items:center;justify-content:center;background:var(--burgundy);color:#fff;font-family:var(--f-display);border-radius:10px;padding:4px 14px;box-shadow:inset 0 0 0 3px #c9ccd3,inset 0 0 0 5px var(--burgundy),0 2px 0 rgba(0,0,0,.25);letter-spacing:.03em}
.plate.cream{background:var(--cream);color:var(--burgundy);box-shadow:inset 0 0 0 3px #c9ccd3,inset 0 0 0 5px var(--cream),0 2px 0 rgba(0,0,0,.2)}

/* Acasă */
.hero{padding-block:28px 10px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,64px);color:var(--burgundy);line-height:1}
.hero h1 span{display:block;color:var(--ink);font-size:.58em;margin-top:6px}
.hero .lead{font-size:19px;color:var(--muted);margin-top:14px;max-width:46ch}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.hero-car{position:relative}
.hero-car .car{width:100%;height:auto;filter:drop-shadow(0 10px 10px rgba(0,0,0,.12))}
.hero-car .road-strip{height:16px;background:repeating-linear-gradient(90deg,var(--road) 0 40px,#454a57 40px 80px);border-radius:8px;margin-top:-10px}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr}.hero-car{order:-1;max-width:420px;margin:0 auto;width:100%}}
.section-h{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.section-h h2{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--burgundy)}
.seg{display:inline-flex;background:var(--paper);border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:800;font-size:15px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.stages{grid-template-columns:1fr}}
.stage{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.stage:hover{transform:translateY(-2px)}
.stage:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.stage .top{display:flex;align-items:center;gap:10px}
.stage .plate{font-size:20px}
.stage h3{font-size:22px;font-weight:800}
.stage p{color:var(--muted);font-size:15.5px;line-height:1.35}
.stage .ex{font-weight:800;font-size:19px;letter-spacing:.02em;background:var(--bg);border-radius:10px;padding:6px 10px;align-self:flex-start;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:3px}
.stars svg{width:24px;height:24px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
@media (max-width:560px){.cards2{grid-template-columns:1fr}}
.bigcard{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.bigcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bigcard .ic{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--burgundy);color:var(--cream)}
.bigcard .ic svg{width:32px;height:32px}
.bigcard h3{font-size:21px;font-weight:800}
.bigcard p{color:var(--muted);font-size:15.5px}
.footer{padding-block:28px 36px;color:var(--muted);font-size:14px;text-align:center}

/* Pista */
.play{padding-block:14px 30px;display:flex;flex-direction:column;gap:14px}
.playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.playhead .title{display:flex;align-items:center;gap:10px;min-width:0}
.playhead h2{font-size:22px;font-weight:800}
.chipinfo{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
@keyframes wave{50%{transform:skewY(6deg) scaleX(.94)}}
.racer{position:absolute;width:var(--cw);transition:left .9s cubic-bezier(.3,.7,.3,1)}
.racer .car{width:100%;height:auto;display:block}
.calm .calm .car .spokes{transform-box:fill-box;transform-origin:center}
.driving .car .spokes{animation:spin .35s linear infinite}
.driving .car .bodyg{animation:bob .3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-1.2px)}}
.puff{position:absolute;left:-8%;top:55%;width:18px;height:18px;border-radius:50%;background:rgba(200,200,205,.9);animation:puff .9s ease-out forwards}
@keyframes puff{to{transform:translate(-30px,-16px) scale(2.2);opacity:0}}
.sputter .car{animation:sput .5s}
@keyframes sput{20%,60%{transform:translateX(-4px) rotate(-2deg)}40%,80%{transform:translateX(3px) rotate(1deg)}}

/* Exercițiul */
.board{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px;align-items:center}
.prompt{font-weight:800;font-size:20px;text-align:center;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.prompt .step{background:var(--burgundy);color:var(--cream);border-radius:999px;font-size:14px;padding:2px 12px}
.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 5px;font-size:clamp(22px,5.8vw,54px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;min-height:1.6em;padding:6px 4px}
.tk{display:inline-flex;align-items:center;justify-content:center}
.tk.n{padding:0 2px}
.tk.n.fresh{animation:pop .5s cubic-bezier(.2,1.6,.4,1);color:var(--good)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.tk.br{font-family:var(--f-display);font-weight:400;font-size:1.05em;padding:0 1px}
.tk.br.fade{animation:fade .45s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.6)}}
button.op{min-width:1.3em;height:1.3em;min-height:40px;border-radius:.3em;border:3px solid var(--ink);background:var(--cream);font-weight:800;font-size:1em;line-height:1;padding:0 .12em;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
button.op:hover{background:var(--gold-hi)}
button.op:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.op[disabled]{cursor:default;background:transparent;border-color:transparent;box-shadow:none}
button.op.wrong{animation:shake .45s;background:var(--bad-bg);border-color:var(--bad)}
button.op.hint{animation:glow 1s ease-in-out infinite;background:var(--gold-hi)}
@keyframes glow{50%{box-shadow:0 4px 0 var(--ink),0 0 0 8px rgba(198,155,79,.45)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.selg{display:inline-flex;align-items:center;gap:5px;background:var(--gold-hi);border:3px dashed var(--burgundy);border-radius:16px;padding:2px 6px}
.selg button.op{background:var(--burgundy);color:var(--cream)}
.result-line{font-family:var(--f-display);font-weight:400;color:var(--good)}

.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:640px}
@media (max-width:560px){.answers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ans{min-height:72px;border-radius:18px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:32px;box-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ans.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .45s;opacity:.6}
.ans.right{background:var(--good-bg);border-color:var(--good)}
.ans[disabled]{cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mech{display:flex;gap:12px;align-items:flex-start;width:100%;max-width:640px;padding:12px 14px;border-radius:16px;background:var(--info-bg);border:2px solid var(--gold)}
.mech.bad{background:var(--bad-bg);border-color:var(--bad)}
.mech.good{background:var(--good-bg);border-color:var(--good)}
.mech .face{width:46px;height:46px;flex:none}
.mech b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mech p{font-size:18px;font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--ink)}
.dots i.done{background:var(--gold)}
.dots i.cur{background:var(--burgundy)}

/* Ferestre */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,22,30,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:rise .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:34px;color:var(--burgundy)}
.dialog .bigstars svg{width:58px;height:58px}
.dialog .bigstars svg.on{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.dialog .bigstars svg:nth-child(2){animation-delay:.2s}.dialog .bigstars svg:nth-child(3){animation-delay:.4s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fact{display:flex;gap:12px;align-items:center;text-align:left;background:var(--cream);border-radius:16px;padding:12px 14px;border:2px solid var(--gold)}
.fact .car{width:110px;flex:none;height:auto}
.fact b{display:block;color:var(--burgundy);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.dialog .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.unlock{font-weight:800;color:var(--good)}

/* Reguli și garaj */
.page{padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.page h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);color:var(--burgundy)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.rules{grid-template-columns:1fr}}
.rule{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--ink)}
.sign{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;border:5px solid var(--bad);background:#fff;color:var(--ink)}
.sign.blue{border-color:#2f6db0;background:#2f6db0;color:#fff}
.sign.tri{border-radius:8px;border-color:var(--gold);background:var(--gold-hi)}
.rule h3{font-size:21px;font-weight:800}
.rule p{color:var(--muted);font-size:16px}
.rule .ex{margin-top:6px;font-weight:800;font-size:18px}
.demo{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:12px}
.demo .expr{font-size:clamp(26px,5.4vw,44px)}
.demo .note{font-weight:700;font-size:18px;text-align:center;min-height:2.6em}
.garage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.garage{grid-template-columns:1fr}}
.gcar{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:8px}
.gcar.sel{background:var(--cream);outline:4px solid var(--gold);outline-offset:-10px}
.gcar .car{width:100%;height:auto}
.gcar .lock{position:absolute;inset:0;border-radius:19px;background:rgba(232,234,238,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;text-align:center;padding:16px}
.gcar .lock svg{width:40px;height:40px}
.gcar h3{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gcar p{color:var(--muted);font-size:15.5px}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.specs span{background:var(--bg);border-radius:8px;padding:2px 8px;font-weight:700;font-size:14px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;animation:rise .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tk.br{color:#2f6db0}
/* Pista cu benzi: una pentru fiecare jucător sau echipă */
.track{--cw:min(112px,22%);position:relative;height:calc(52px + var(--lanes) * 62px);border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(180deg,var(--sky) 0 26px,var(--grass) 26px 38px,var(--road) 38px calc(100% - 10px),var(--grass) calc(100% - 10px))}
.track .lane-line{position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#f1e4c9 0 26px,transparent 26px 52px);opacity:.7}
.track .finish{position:absolute;top:38px;bottom:10px;right:5%;width:18px;background-image:linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%),linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%);background-color:#fff;background-size:12px 12px;background-position:0 0,6px 6px}
.track .post{position:absolute;top:28px;width:6px;height:10px;background:var(--cream);border-radius:2px}
.track .post.done{background:var(--gold)}
.track .flagpole{position:absolute;right:calc(5% + 6px);top:4px;width:3px;height:34px;background:#222}
.track .flag{position:absolute;right:calc(5% - 26px);top:4px;width:32px;height:20px;background-image:linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%),linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%);background-color:#fff;background-size:10px 10px;background-position:0 0,5px 5px;transform-origin:left center;animation:wave 1.6s ease-in-out infinite;border:1px solid #222}
.racer{position:absolute;width:var(--cw);transition:left .9s cubic-bezier(.3,.7,.3,1)}
#rival{transition:left .25s linear}
.racer .tag{position:absolute;left:0;top:-16px;max-width:170%;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 8px;white-space:nowrap;line-height:1.4}
/* Setări pe pagina principală */
.settings{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--ink);margin-top:16px}
.setting,.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:20px;height:20px}
.seg.big button{min-height:50px;font-size:16px;padding:8px 16px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
@media (max-width:860px){.cards3{grid-template-columns:1fr}}
.footer{font-weight:600}
/* Grupe */
.dialog.wide{width:min(720px,100%)}
.muted{color:var(--muted)}.small{font-size:14px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:560px){.names{grid-template-columns:1fr}}
.namefield{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:6px 10px}
.namefield .sw{width:70px;flex:none}.namefield .sw .car{width:100%;height:auto;display:block}
.inp{width:100%;min-width:0;min-height:46px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;font-size:17px;background:#fff;color:var(--ink)}
textarea.inp{font-weight:600;font-size:16px;line-height:1.35;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:600;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--burgundy)}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px;color:var(--muted)}
.turn{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 16px;min-height:62px}
.turn:empty{display:none}
.turn .tcar{width:84px;flex:none}.turn .tcar .car{width:100%;height:auto;display:block}
.turn-car{width:min(240px,70%)}.turn-car .car{width:100%;height:auto}

.wheel-box{position:relative;width:min(440px,100%);margin:0 auto;aspect-ratio:1}
.wheel-cv{width:100%;height:100%;display:block}
.wheel-pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--burgundy);z-index:2;filter:drop-shadow(0 3px 0 var(--ink))}

}
function finishTeam() {

/* ---------- Grupele clasei ---------- */
const studentList = () => S.students.split(/\r?\n/).map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
function shortName(n) { const w = n.split(/\s+/); return w.length > 2 ? w[0] + ' ' + w[1] : n; }
/* Împarte elevii în grupe de câte „size” (4–6): grupele ies egale, cu cel mult un elev diferență */
function groupSizes(N, size) {
  if (N < 2) return [N];
  let g = Math.max(1, Math.floor(N / size)); const r = N - g * size;
  if (r > 0 && !(size < 6 && r <= g)) g++;
  g = Math.min(g, MAX_TEAMS, N);
  const base = Math.floor(N / g), extra = N % g; return Array.from({ length: g }, (_, i) => base + (i < extra ? 1 : 0));
}
function makeGroups(size) {
  const names = shuffle(studentList()); const sizes = groupSizes(names.length, size);
  const groups = sizes.map((n, i) => ({ name: TEAM_NAMES[i] || 'Grupa ' + (i + 1), members: [] })); const order = [];
  let g = 0; for (const nm of names) { let tries = 0; while (groups[g].members.length >= sizes[g] && tries++ < groups.length) g = (g + 1) % groups.length; groups[g].members.push(nm); order.push([nm, g]); g = (g + 1) % groups.length; }
  return { groups, order };
}

      const i = nextOps(tk)[0]; pending = i; draw(i); SND.pick();
      const why = tk.some(t => t.k === '(') ? 'Întâi paranteza:' : isMD(tk[i].v) ? 'Înmulțirea și împărțirea trec primele:' : 'Au rămas adunări și scăderi, deci din stânga:';
      $('#dnote').textContent = `${why} ${fmt(tk[i - 1].v)} ${tk[i].v} ${fmt(tk[i + 1].v)} = ${fmt(calc(tk[i - 1].v, tk[i].v, tk[i + 1].v))}`;
    } else {
      applyOp(tk, pending); collapse(tk); pending = null; const done = tk.length === 1; draw(null, done); SND.ok();
      $('#dnote').textContent = done ? 'Gata! Acesta este rezultatul final.' : 'Apasă din nou pentru pasul următor.'; if (done) $('#dnext').disabled = true;
    }
  };
  $('#dnew').onclick = set; set();
}

/* ---------- Garajul ---------- */
function viewGarage() {
  const ts = totalStars();
  $('#app').innerHTML = `<div class="wrap page">
    <div><button class="btn btn-sm" id="back">${ICON.back}Înapoi</button></div>
    <h1>Garajul tău</h1><p style="font-size:19px;color:var(--muted)">Ai <b style="color:var(--ink)">${ts} ${ts === 1 ? 'stea' : 'stele'}</b>. Câștigă stele în cursele individuale ca să deblochezi mașini noi.</p>
    <div class="garage">${CARS.map(c => { const open = ts >= c.need; return `<div class="gcar ${S.car === c.id ? 'sel' : ''}">
      ${carSVG(c)}<h3>${esc(c.name)} <span class="plate" style="font-size:16px">${c.year}</span></h3>
      <div class="specs">${c.specs.map(s => `<span>${esc(s)}</span>`).join('')}</div><p>${esc(c.fact)}</p>
      ${open ? (S.car === c.id ? '<span class="chipinfo" style="align-self:flex-start">Mașina ta</span>' : `<button class="btn btn-sm btn-go" data-car="${c.id}" style="align-self:flex-start">Alege mașina</button>`) : ''}
      ${open ? '' : `<div class="lock">${ICON.lock}<span>Se deblochează la ${c.need} stele</span><span style="font-weight:600;color:var(--muted)">Îți mai trebuie ${c.need - ts}</span></div>`}</div>`; }).join('')}</div></div>${footer()}`;
  $('#back').onclick = () => go('home');
  $$('[data-car]').forEach(b => b.onclick = () => { S.car = b.dataset.car; save(); SND.horn(); viewGarage(); toast('Mașina ta este acum ' + myCar().name + '!'); });
}

document.addEventListener('visibilitychange', () => { if (G) G.last = performance.now(); });
go('home');

</script>
